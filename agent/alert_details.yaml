- type: "顾问专业性"
  details: |
    - [专业-描述-01] 材料审核与网申填报疏漏：服务方顾问（售后主导师、规划师或咨询顾问）在准备或审核申请材料、证明文件、翻译件及填报网申系统时，出现信息错填、关键字段漏改、文件漏传、版本错用或模板低级错误等业务失误。
    - [专业-描述-02] 政策解答不清与跟进敷衍滞后：对院校申请规范、材料认证要求或推荐信机制解释模糊；对客户的加申、选专业或进度询问长期拖延回复、态度敷衍（仅机械应答却无实质推进），或在缺乏充分依据的情况下草率删减学生背景经历。
    - [专业-描述-03] 专业资历受疑与换人诉求：客户因前期服务体验不佳、阶段性申请未获预期结果（如提前批未录）或担忧顾问经验不足，要求查验同方向成功案例，或明确提出更换主导师、规划师及咨询顾问。
    - [专业-边界-01] 本类 vs 『文书问题』：若客户仅对文书（CV/PS/RL）的文字质量、专业度、AI率、多项目差异化或修改时效不满，或仅要求更换文书老师 -> 归入『文书问题』；若对文书/文件粗糙度的不满与对顾问网申填报疏漏、申请跟进敷衍的不满同时叠加，且矛头直指顾问不负责或要求一并更换申请顾问 -> 优先归入『顾问专业性』。
    - [专业-边界-02] 本类 vs 『其他』：日常材料准备与填报核对中的一般性疏漏（可在递交前修正或属于常规服务瑕疵）归入『顾问专业性』；若已造成网申后台实质性漏交、错交或串用账号等导致错过申请轮次的重大投递事故 -> 归入『其他』。
    - [专业-边界-03] 【优先归属】：本类 vs 『文书问题』：若客户对网申上传文件/申报材料的精细度与文书质量一并提出批评，且核心矛头直指顾问工作态度粗糙、审核把控不严或缺乏责任心，优先归入『顾问专业性』。
    - [专业-边界-04] 【豁免条款】：若核心实质是因学生自身背景/成绩不达标（如合作办学学位受限、语言未达标等）导致Offer条件无法达成或引发加申退费纠纷，客户由此衍生的策略质疑或服务抱怨，归入对应主诉类别；顾问日常沟通中单次称呼口误且即时更正、未引发客户正面追责与信任危机的常规瑕疵，予以豁免，不归入本类。
    - [专业-预兆-01] 客户在核对网申截图、证明文件或合并材料时，连续指出日期、成绩、个人经历或格式上的低级错漏（典型措辞如：“老师，您合并的文件/填报的系统里信息又没更新，这种基础细节怎么总是出错？”）。
    - [专业-预兆-02] 顾问对院校规则或材料要求解答含糊，或对材料细节不一致抱以无所谓的敷衍态度，引发客户质疑（典型措辞如：“证明文件上的要求跟学校官网说的不一样，这样交上去会影响审核吗？”、“系统里的描述和简历不一致怎么能说不改也行呢？提交的材料太粗糙了，希望老师能认真对待！”）。
    - [专业-预兆-03] 客户密集盘问顾问过往同类院校申请经验与成功案例，或因阶段性申请无果、响应迟缓向销售提出更换顾问（典型措辞如：“加申和选专业的事情问了很久都没推进，每次只说跟进却没下文，我们想换一位更有经验、更负责的申请老师。”）。
    - [专业-预兆-04] 客户在服务初期或选校规划期对顾问资质持明确怀疑态度，在已提供顾问介绍的情况下，仍强制要求查验特定国家/顶尖名校同方向成功案例与带案战绩方认可团队资格。
    - [专业-预兆-05] 客户在网申协助与文件上传阶段，严厉指责已交/待交申请文件制作粗糙、缺乏申请者视角，要求团队端正服务态度并严格自查。
    - [专业-预兆-06] 【把关疏漏返工与经历删减合理性质疑】：顾问前期审核把关不严导致已盖章证明文件因专业名称/拼写错漏返工，或在协助修改证明时连续被客户指出日期、人称代词错误；或在简历/材料定稿阶段草率建议删减核心实习经历，遭家长与学生连续多轮反问质疑合理性（认为两段经历应同时体现并要求费心把关调整），而顾问最终仅以“好滴好滴/好的好的”等简短口头禅敷衍收尾时，即便末尾语气客气，仍须触发『顾问专业性』预警。

- type: "费用相关"
  details: |
    - [费用-描述-01] 解约退费与扣除比例争议：客户因个人升学路径变更（如保研、国内录取、合作项目录取）、客观条件受限（如语言未达标、家庭经济变故）或主观放弃出国而提出终止合同，并对合同约定的阶段性退费比例或扣除标准不认可，要求提高退费比例或全额退费。
    - [费用-描述-02] 缩减服务范围与退单项费诉求：客户在服务中途决定放弃特定申请地区、特定项目或未实际开展的付费增值服务，要求单独退还对应的地区差价、项目费或加申费。
    - [费用-描述-03] 附加服务费减免博弈：客户在定校后、文书完成后或跨申请季时提出更换专业、替换项目或额外加申，但拒绝按合同规定支付加申费或文书重制费，要求免费更换或免费加申。
    - [费用-描述-04] 衍生第三方费用追责：因前期指导偏差或流程延误，导致客户产生二次材料认证费、加急办理费（如签证加急费）或额外申请费，客户要求机构承担或赔付。
    - [费用-边界-01] 本类 vs 『录取风险』：当客户保研或决定放弃部分申请后，凡核心诉求是终止合同、核算退款或争执退费比例 -> 归入『费用相关』；若明确不办理退费，而是要求砍掉所有保底校、仅孤注一掷单申极少数顶尖冲刺项目 -> 归入『录取风险』。
    - [费用-边界-02] 本类 vs 『定校相关』：若核心矛盾聚焦于“抗拒支付换专业/加申费用、要求退还单项费或在缴费阶段弃申退钱” -> 归入『费用相关』；若聚焦于选校档次合理性、专业匹配度或学制限制导致的选校方案调整 -> 归入『定校相关』。
    - [费用-边界-03] 本类 vs 『语言不达标』：若客户已明确决定放弃申请并进入实质性的退费金额/比例交涉 -> 归入『费用相关』；若核心卡点仍是语言成绩未达标、无法正常投递，仅在沟通受阻时试探性询问“考不出语言能否退费” -> 归入『语言不达标』。
    - [费用-边界-04] 【豁免条款】：群内尚未出现任何终止合同、退费核算、减免加申/换专业收费或额外费用承担等涉及资金与权益的实质性诉求前，单纯的文书修改与质量讨论、顾问日常称呼口误、常规选校替换或日常节日问候，一律不得提前归入『费用相关』。
    - [费用-预兆-01] 客户告知已获得其他升学/就业保底去向或遭遇家庭变故，主动询问合同退费条款与结算流程。
    - [费用-预兆-02] 客户对按服务进度核算的退费比例表示强烈异议，试图归咎服务方未提前劝阻以争取更高退费比例（典型措辞如：“孩子已经确定保研/不出国了，麻烦办理一下退费，但按目前阶段只退这个比例我们不能接受。”）。
    - [费用-预兆-03] 客户提出减少申请地区、取消加申项目或更换已写文书的专业，同时对收费规则表现出明显抵触（典型措辞如：“这个地区/加申项目我们决定不申了，文书也还没开始写，请把对应的单项费用退给我们。”、“因为语言不够想换个专业方向，为什么还要额外收加申费/替换费？我们要求免费更换！”）。
    - [费用-预兆-04] 客户质问因补办认证或加急签证所产生的额外第三方费用应由谁承担（典型措辞如：“重新办理认证和签证加急产生的额外费用，是前期指导失误导致的，这笔钱应该由你们承担吧？”）。
    - [费用-预兆-05] 客户或家长明确表示放弃后续申请季（如明确放弃次年申请、确定转国内升学等），并在群内正式询问退款申请路径、退费流转流程或结算细则（即使尚未就具体退费比例展开激烈争执）。

- type: "入学风险"
  details: |
    - [入学-描述-01] 本科就读项目突发政策或学位变动：发生在申请递交尾声或已获得录取（Offer）后的行前准备阶段，学生所读的中外合作办学或特殊学制项目在申请后期突发院校解约、合作终止或最终授予学位变更，导致已递交或已获录的硕士项目面临入学资格审查危机。
    - [入学-描述-02] 行前签证审批长期延误（Delay）：学生递交签证后遭遇移民局或签证中心长期延迟审理、背景调查，多次催签仍无实质进展，临近院校选课或最晚报到截止日仍未下签，引发客户极度焦虑并要求加急处理、报备晚到校或更换行前指导老师。
    - [入学-边界-01] 本类 vs 『录取风险』：本类发生在申请收尾或获录后的行前阶段，核心是“已获录或全线定局后因签证延误、本科项目解约导致无法按期报到入学”；若在申请与审理阶段，因国际本科/合作办学背景导致收到的有条件录取（Con-Offer）附加了无法达成的学位认证条件，且尚有未递交项目需调整选校与填报策略 -> 归入『录取风险』。
    - [入学-预兆-01] 学生同步本科院校关于合作项目变更、学位授予调整等突发官方通知，担忧影响后续所有项目入学（典型措辞如：“学校突然通知我们的合作办学项目有变动，最终拿到的学位可能要改，这会不会影响后续项目的正常入学？”）。
    - [入学-预兆-02] 签证审理周期远超常规时限或收到官方延迟审理通知，距离开学报到节点越来越近。
    - [入学-预兆-03] 家长频繁催问下签进度，寻求撤签重递、官方加急、向学校申请延期报到（Late Arrival）或要求更换行前老师（典型措辞如：“签证递上去这么久一直被delay，催签也没结果，眼看就要到最晚报到和选课时间了，能不能换个行前老师想想办法？”、“如果签证实在赶不上开学，能不能先帮我们联系学校报备延期到校？”）。

- type: "语言不达标"
  details: |
    - [语言-描述-01] 长期备考未达标或逾期未出分：在临近或已超过选校确认单约定的出分时间节点、或目标院校网申已开放/即将截止时，学生多次考试仍卡在语言（雅思、托福等）或标化考试（GRE、GMAT等）总分或小分门槛之下，或服务冻结重启后、约定出分日届满时仍无合格成绩，直接导致目标院校无法按期投递。
    - [语言-描述-02] 意向摇摆导致备考拖延：学生因同步准备国内校招、考研或实习，备考精力分散，将语言考试时间一再推迟至网申核心轮次之后。
    - [语言-描述-03] 低分强投受阻与衍生焦虑：因长期考不出合格语言成绩，客户试图用未达标分数强行投递高要求项目被拒，进而对后续能否录上产生焦虑，甚至顺带试探若最终考不出语言能否协商退费。
    - [语言-边界-01] 本类 vs 『申请策略』：本类专指语言（雅思/托福）及标化考试（GRE/GMAT）分数未达标或推迟出分导致的投递卡点；若因本科GPA绩点、均分或学校成绩等级换算规则不达标导致无法申请 -> 归入『申请策略』。
    - [语言-边界-02] 本类 vs 『费用相关』：若核心矛盾仍是语言成绩卡壳导致无法投递，客户仅在沟通语言替代方案时附带试探“实在考不出能不能退费” -> 优先归入『语言不达标』；若客户已明确放弃申请并正式要求核算退费比例与金额 -> 归入『费用相关』。
    - [语言-预兆-01] 已过约定的语言出分节点，学生反馈最新实考分数仍低于目标院校硬性门槛（典型措辞如：“选校单约定这个月出合格语言成绩，但这次考出来还是差一点，目标学校是不是暂时交不了？”）。
    - [语言-预兆-02] 学生因兼顾找工作或其他事务，将后续考试计划推迟至年底，面临错失主流投递轮次的风险（典型措辞如：“最近在忙秋招/实习，雅思预计要推迟到年底才能再去考了，现在已经开放的项目要不要调整？”）。
    - [语言-预兆-03] 服务方多次提醒语言卡点，建议加申免语言/低语言门槛保底项目或考虑延期申请，或客户试探低分强投（典型措辞如：“如果后面实在考不出合格的语言成绩，能不能先拿现在的低分试投一下，或者协商退费？”）。

- type: "拖延失联"
  details: |
    - [拖延-描述-01] 长期已读不回与阶段性失联：服务方多次催促成绩单、学籍证明、文书素材或选校确认时，学生长期不回复或仅回复日常寒暄而回避核心任务，甚至连家长也难以联系督促。
    - [拖延-描述-02] 多线并行导致严重逾期：临近院校网申开放或首轮截止，学生因忙于国内升学考试、跨专业作品集或实习，将留学材料与文书提纲一再搁置，远超约定交付时间。
    - [拖延-描述-03] 家校配合错位型拖延：学生本人消极逃避、迟迟不提供基础材料导致流程卡死，但家长在群内单方面积极询问申请策略、成功率或文书方向（此时实质阻塞点仍在于学生拖延未交材料）。
    - [拖延-边界-01] 本类 vs 『难度客户』：本类的核心特征是客户方处于“消极逃避、失联断联、迟迟不交材料”的被动停滞状态（即便家长态度配合，只要流程因学生不交材料而卡死即归本类）；若客户自身拖延交出材料后，反过来在群内焦虑施压、无视常规制作周期强逼老师在极短时间内加急出稿赶DDL，或高频投诉回复慢 -> 归入『难度客户』。
    - [拖延-边界-02] 【豁免条款】：若学生虽未在群内直接沟通，但家长或代理人实质全面介入文书与申请流程，频繁推翻已定内容、基于AI或第三方意见反复发起多轮细微修改、多次重复询问或高频施压，此情形核心矛盾在于客户方挑剔折腾与过度干预，严禁归入本类，应让路归入『难度客户』。
    - [拖延-预兆-01] 超过原定材料收集截止日后，服务方跨多个自然日在群内反复提醒、@学生索要成绩单或文书提纲，学生无实质回应（典型措辞如：“同学，成绩单和文书素材距离原定截止时间已经逾期很久了，看到消息麻烦尽快发一下，不然要赶不上首轮递交了。”）。
    - [拖延-预兆-02] 临近申请关键节点，学生因备战其他考试或事务长期隐身。
    - [拖延-预兆-03] 顾问被迫在群内或私下请家长介入，协助督促学生提交基础申请材料（典型措辞如：“孩子最近在学校忙考研/作品集一直没顾上看群，晚点我催他把材料发过来；另外老师我想先了解下咱们目前的申请策略和成功率。”）。
    - [拖延-预兆-04] 学生以备战语言考试、国内升学考研、作品集或实习等为由，在群内长期消极沉默、已读不回或回复严重滞后，导致推荐信、个人陈述提纲等申请核心物料逾期卡死，迫使服务方跨周期反复群内@提醒或转入私聊重点催办。
    - [拖延-预兆-05] 【主体失联与家长代劳催收】：系统或服务方多次提醒确认已交付文书或跨周期索要成绩单/在读证明等核心学术材料，但学生本人当日全程沉默未响应（或家长在长文沟通概要中明确指出学生对文书“不能只是点已收到、需要有实质反馈”），仅由家长在群内代为沟通学分、选校与策略且服务方仍在追问本周学术材料能否发送时，即便家校互动表面客气融洽，仍须穿透表象触发『拖延失联』预警。

- type: "申请策略"
  details: |
    - [策略-描述-01] 分批投递时间线与留位费统筹争议：前期制定了分梯队/分地区的分批投递计划（旨在规避不同地区院校出结果时间差引发的高额留位费冲突），后因等待学生证件、盖章材料或语言成绩导致首批投递顺延，客户质疑未按期递交并担忧后续批次出结果顺序打乱。
    - [策略-描述-02] 成绩单均分/等级换算规则受阻：学生最新均分或学校官方开具的等级证明换算标准不利（如字母等级对应绩点偏高、均分未达隐性门槛），导致原定目标院校申请受阻；或围绕是否等待学校新评分政策出台再行投递产生分歧。
    - [策略-描述-03] 轮次录取概率与投递时机博弈：客户根据外部扩招传闻或对特定轮次录取率的担忧，强烈要求在特定小轮次截止前抢投、跨院校名单冲刺，或在首选校与次选校的投递先后顺序及留位费成本之间反复权衡。
    - [策略-边界-01] 本类 vs 『难度客户』：若前期已有明确的分批投递规划，矛盾聚焦于“不同梯队院校谁先投、如何避免留位费冲突、因等材料导致批次顺延的责任认定、或成绩等级换算与轮次概率博弈” -> 优先归入『申请策略』（即便客户在争论投递策略时言辞激烈或声称投诉，只要核心议题围绕既定投递节奏与客观条件展开，仍归本类）；若客户系临时新签或因自身长期拖延刚交出文书提纲，却无视客观文书制作周期强逼几天内成稿赶首轮DDL -> 归入『难度客户』。
    - [策略-边界-02] 本类 vs 『定校相关』：本类聚焦于投递阶段的批次节奏、轮次先后、留位费时间差及成绩换算对投递时机的影响；若聚焦于定校阶段拒接保底校档次、因学制或课程重合无法申请原专业而需修改选校确认单 -> 归入『定校相关』。
    - [策略-边界-03] 【豁免条款】：若争议表面涉及能否赶上特定院校或第一轮申请截止，但核心诱因是客户自身前期备考语言拖延、未按时提供文书提纲，临近截止才出分并无视客观制作周期，强行施压要求机构在数日内极限赶工（包括自行撰写PS而强逼团队数日内抢出CV/推荐信初稿赶首轮），此类本质系对极限交付周期的非理性施压，严禁归入『申请策略』，必须一律豁免并归入『难度客户』。
    - [策略-边界-04] 【优先归属判定】：凡因学生护照证件、官方盖章或成绩等材料到位滞后，导致既定分批投递节奏顺延、未能在网申开放第一时间或约定节点递交，进而引发客户强烈焦虑并严厉质问、指责机构失职拖延的，只要核心矛盾根植于‘递交时间线延误、分批递交节奏被打乱及约定履约节点的争执’，无论客户措辞多么激烈、态度多么强硬或是否存在投诉倾向，均一律优先判定为『申请策略』，严禁因沟通摩擦大而张冠李戴判定为『难度客户』。
    - [策略-预兆-01] 学校开出官方成绩单或等级证明后，发现换算规则导致有效绩点低于目标项目要求（典型措辞如：“虽然目前绩点涨了，但学校等级证明把这一档折算得很高，按这个规则是不是申不了原定的学校了？”）。
    - [策略-预兆-02] 网申开放季，客户密集追问第一批项目为何尚未递交，反复核算不同院校下发录取与缴纳留位费的时间窗口（典型措辞如：“之前规划好第一批先交这几所、第二批再交其他学校，为什么材料齐了还没按计划递交？要是出结果顺序乱了导致留位费打架怎么办？”、“我们最想去首选学校，但又怕保底学校先出结果要交高额留位费，这两边的投递时间差怎么安排最稳妥？”）。
    - [策略-预兆-03] 客户围绕某一小轮次截止日的录取概率、院校是否扩招或学校换分政策与顾问展开拉锯（典型措辞如：“听说这个项目今年后面轮次录取概率很小，我们要求必须在当前这一轮截止前递交上去！”）。

- type: "文书问题"
  details: |
    - [文书-描述-01] 事实错误与专业度质疑：客户指出已交付文书（简历CV、个人陈述PS、推荐信RL、Essay等）中存在院校/实习名称、学历学位、成绩排名等事实性错漏，排版格式不规范，或认为专业术语翻译生硬、机翻痕迹重、缺乏学术与行业专业度。
    - [文书-描述-02] AI检测率数值争议：客户使用第三方工具自查文书AI率偏高，不认可机构内部的检测标准，强制要求提供官方检测报告或将AI率压低至极端阈值以下，并因此质疑文书原创性。
    - [文书-描述-03] 多项目高度定制化诉求：客户拒绝同方向项目的文书框架复用，要求每个申请项目均撰写完全不同版本的文书，或要求对不同细分方向的经历描述做深度差异化拆分。
    - [文书-描述-04] 外部挑刺与推翻重写：客户将文书交由外部人员（如同行、外校老师）审阅批注后全盘否定初稿，或在临近递交时大幅增删个人经历要求推翻重写，或因文书风格不合预期明确要求更换文书老师。
    - [文书-描述-05] 素材匮乏与返稿超期摩擦：学生不愿配合提供主观文书素材却嫌弃初稿空洞，或文书老师超出约定返稿时间未交付修改稿，以及围绕外教润色等文书附加服务安排产生分歧。
    - [文书-边界-01] 本类 vs 『顾问专业性』：凡核心矛盾聚焦于文书（CV/PS/RL）本身的内容质量、事实错漏、AI率、项目差异化、修改返稿超期或要求更换文书老师（writer） -> 归入『文书问题』；若不仅对文书不满，还叠加了对主导师网申填报敷衍、申请进度把控失职的不满，且要求将申请主导师与文书老师一并更换 -> 优先归入『顾问专业性』。
    - [文书-边界-02] 本类 vs 『难度客户』：凡文书尚未逾期，服务方告知的是正常文书制作/翻译排期（如PS初稿需2~4周、中翻英需1周、高峰期正常排期），而客户因签约晚、晚交提纲或焦虑赶DDL，拒不接受正常制作周期、质疑排期推迟、要求出具事项进程表或书面倒排时间表的 -> 一律归入『难度客户』，严禁归入『文书问题』！此外，若家长凭AI工具/外部意见在多次定稿确认后仍反复变卦折腾4轮以上、或在正常响应时效内高频电话轰炸投诉 -> 亦归入『难度客户』；仅当围绕已交付文书的质量瑕疵、AI率标准或实质性的返稿逾期展开交涉时 -> 归入『文书问题』。
    - [文书-边界-03] 【豁免条款】：凡因学生自身主观诉求变更（如自行推翻已确认提纲、更换申请专业方向）而主动要求重开提纲编辑权限或重写文书，且服务方交付并无客观质量瑕疵的，严禁归入『文书问题』。
    - [文书-边界-04] 【豁免条款】：凡文书制作仍在协商周期内，客户仅温和询问进度且未质疑排期合理性的，严禁归入『文书问题』（但若客户质疑常规制作/中翻英排期慢、要求出具事项进程表或倒排时间表的，必须归入『难度客户』）。
    - [文书-边界-05] 【豁免条款】：客户不仅对文书表达不满，还全面质问申请文件粗糙、网申递交马虎并质疑团队整体认真度的，优先让路给『顾问专业性』。
    - [文书-预兆-01] 客户审阅文书初稿后指出多处个人背景事实错误、用词生硬，或发来第三方平台的高AI率检测截图要求整改（典型措辞如：“简历和个人陈述里的基础信息都有写错的地方，而且专业表述机翻味太重，我们要求重写并更换文书老师！”、“我自己用检测软件查出来这篇文书的AI率很高，必须修改到所有平台检测都低于标准，并把检测报告发我确认！”）。
    - [文书-预兆-02] 客户对同一篇文书提出多轮相互矛盾的修改意见，密集追问确切返稿时间（典型措辞如：“我已经把详细的修改批注发群里了，请给我一个确切的文书修改反馈时间！”）。
    - [文书-预兆-03] 客户强调所有申请项目必须独立成篇、拒绝共用模板，或索要其他过往客户的定稿文书作为参照（典型措辞如：“这几个项目虽然方向相近，但我们不接受共用模板，要求每个项目都写完全不同的文书来体现区分度。”）。
    - [文书-预兆-04] 客户明确提出要求重写文书或更换文书老师。

- type: "其他"
  details: |
    - [其他-描述-01] 网申后台重大投递事故：在网申递交关键环节，因主导师未核查最终提交状态（如缴费后漏点Submit）、串用其他学生申请端口投错项目或填错核心成绩机制，直接导致错过院校首轮或截止日期的实质性投递事故。
    - [其他-描述-02] 前期违规过度承诺穿帮：前期销售或助理曾私下作出超出合同范围的口头承诺（如特定院校未录全额退费、额外赠送非标背景提升辅导等），后续无法兑现或前后说法不一引发客户追责。
    - [其他-描述-03] 内部系统数据或前期定校失误：内部CRM系统维护的院校轮次截止时间、认可院校名单（List）与学校官网实际规则不符，或前期定校阶段未查清硬性限制导致文书完成后才发现无法申请。
    - [其他-描述-04] 家庭内部意见分裂或参与度异常：家长与学生在“出国留学还是国内考公/就业”上存在严重分歧导致推进受阻；学生全程隐身不参与沟通完全由家长包办；或学生因个人情绪问题在初次沟通时突发抗拒、要求解约。
    - [其他-描述-05] 客户客观变故暂缓或延期服务：客户因获得长期深造机会（如直博）、工作变动、家人患病或资金周转困难等客观原因，主动提出暂缓当季申请并延期至后续申请季。
    - [其他-描述-06] 非标服务纠纷与客户违规操作：围绕模拟面试辅导质量、前期规划方案不满（如批评规划方案针对性不够强、选课明细看不懂、海外交流没必要）或要求更换模拟面试老师/规划师；推荐信类型与官网要求冲突；或客户坚持自行操作网申、私下重复递交、向学校提交虚假材料等高危行为。
    - [其他-边界-01] 本类 vs 『顾问专业性』：日常材料准备与核对中的一般性疏漏、回复迟缓或客户质疑申请顾问资历归入『顾问专业性』；但若已演变为“漏点提交按钮、串用他人账号投错项目导致错过截止日”的后台重大投递事故，或属于内部系统数据错误、前期历史违规口头承诺穿帮、对规划师方案/模拟面试不满及换人、家庭内部意见分裂、客观变故延期及客户提交虚假材料等特殊情形 -> 统一归入『其他』。
    - [其他-边界-02] 【豁免条款】：客户对申请轮次或语言报考政策与前期口径存在认知偏差并质询，虽有抱怨但经团队澄清后已达成调整方案（如替换冲刺项目继续推进），未上升至正式追责索赔或中止申请的，不归入本类。
    - [其他-边界-03] 【豁免条款】：客户在问卷评价或日常沟通中对规划方案细致度、服务态度提出常规批评与优化建议，只要未明确提出更换规划师、暂停服务或解约退费要求的，不归入本类。
    - [其他-预兆-01] 客户翻出前期销售或助理的历史聊天记录与口头承诺，要求机构限期兑现（典型措辞如：“前期老师当时明确承诺过如果没录上目标档次可以全退/答应赠送配套辅导，现在怎么不认账了？必须给我们一个说法！”）。
    - [其他-预兆-02] 核对院校官网时发现内部系统记录的截止日期或认可名单有误，或检查网申后台发现未成功提交、投错项目（典型措辞如：“你们系统里记的截止时间和院校名单跟官网根本不一致！而且为什么网申没检查是否最终提交成功，导致错过了第一轮截止？”、“怎么会用错别人的申请端口把项目交错了？现在已经过了首轮截止时间，你们打算怎么补救？”）。
    - [其他-预兆-03] 群内暴露出家长与学生对是否继续留学意见不一、学生全程不露面，或客户提出因生病、工作、直博等原因暂缓当季申请（典型措辞如：“家里目前对孩子是先考公/工作还是出国意见还没统一（或者家里突发状况/联系上直博导师），今年的申请想先暂缓延期。”）。
    - [其他-预兆-04] 客户审阅规划师提交的规划方案后，明确批评“规划方案针对性不够强、选课明细看不懂、海外交流没必要”，或要求更换规划师/模拟面试老师。
    - [其他-预兆-05] 非标服务及规划方案纠纷的有效预警必须伴随实质性诉求升级（例如：明确要求更换规划师/模拟面试导师、因方案不合格拒绝配合后续文书启动、或明确主张前期违规口头承诺要求赔偿退款），排除已通过内部调解继续正常履约的日常沟通摩擦。

- type: "录取风险"
  details: |
    - [录取-描述-01] 窄申或春季组合批量被拒面临失学：学生申请的项目数量极少或集中于竞争激烈的单一批次（如仅申春季项目），目前已收到多封拒信且剩余项目长期无音讯，面临全线落榜风险，亟需协商加申保底或延期申请季。
    - [录取-描述-02] 极端窄申与孤注一掷策略：学生在获得其他保底出路（如保研）或消极备考状态下，明确表示不办理退费，但要求放弃合同内所有常规与保底院校，仅单申一两所顶尖冲刺院校或单一免语言项目，导致合同面临极高的零录取风险。
    - [录取-描述-03] 特殊学制/合作办学录取条件卡死：学生就读中外合作办学或国际本科（仅颁发外方学位），虽获得名校有条件录取（Con-Offer），但录取条件中错误要求提供国内合作院校学位证，导致无法满足换取正式录取的条件，且未递交项目急需调整填报策略。
    - [录取-描述-04] 均分硬伤不达标或成绩证明受限：学生最新GPA/均分无法达到合同约定的联合保底院校画像要求且校内无法重修刷分，或学校官方成绩单的百分制折算分极低，直接威胁目标项目的录取率。
    - [录取-边界-01] 本类 vs 『费用相关』：若客户保研或决定放弃申请后，核心诉求是解约退钱 -> 归入『费用相关』；若明确不退费，而是砍掉所有保底项目仅孤注一掷单申顶尖项目，或因已申项目全拒面临失学而在商讨补救方案时顺带询问“延期申请季是否需要加钱” -> 优先归入『录取风险』。
    - [录取-边界-02] 本类 vs 『入学风险』：若在申请与换取无条件录取阶段，因合作办学学位归属问题导致Con-Offer条件无法达成，且需同步调整后续未交项目的选校与网申策略 -> 归入『录取风险』；若所有申请已尘埃落定，在行前阶段因4+0项目突发解约或签证长期延误导致无法按时报到 -> 归入『入学风险』。
    - [录取-预兆-01] 群内连续反馈主申项目或窄申组合收到拒信，剩余少量项目多次发邮件催问均石沉大海（典型措辞如：“我申请的这几个项目现在拒的拒、没消息的没消息，万一全部落榜能不能紧急加申其他保底，或者延期到下一申请季？”）。
    - [录取-预兆-02] 学生明确表态砍掉其他所有规划院校，仅保留极个别顶尖冲刺项目或单一项目（典型措辞如：“我已经保研了（或不想准备其他学校了），后面不退费但只申这一所顶尖学校冲一下，其他保底项目全部放弃不申了。”）。
    - [录取-预兆-03] 发现下发的有条件录取信中包含学生学制客观无法提供的学位材料要求，或最新成绩单均分远低于保底院校门槛（典型措辞如：“我是中外合作办学只拿外方学位，但刚收到的有条件录取竟然要求提供国内合作大学的学位证！后续网申怎么填才能避免再被卡？”、“目前我的均分已经定型且学校不让重修，达不到合同里保底院校的分数要求，这几个项目还能录上吗？”）。

- type: "定校相关"
  details: |
    - [定校-描述-01] 院校定位预期错位与拒接保底：学生院校背景或均分处于劣势，但对院校排名有硬性执念（如坚决不接受特定排名以外的保底校），或因各方对英澳院校认可名单（List）口径不一而迟迟不愿签署选校确认单。
    - [定校-描述-02] 客观学制/课程/推荐人限制导致无法申原专业：经核实发现目标项目不接受特定学制（如三年制本科）、学生本科已修课程与目标硕士课程高度重合、均分未达项目底线或存在学术推荐人利益冲突避嫌，导致原定专业无法申请，需变更合同国家类型或改申其他学位类型（如授课型改研究型）。
    - [定校-描述-03] 选校单签署或文书启动后要求换项目：客户在签署选校确认单或文书初稿完成后，临时要求将单内项目替换为单外其他方向项目，并伴随已使用优惠券或服务权益的归属核销问题。
    - [定校-描述-04] 就业出路干扰暂缓定校与合同跨期调整：学生因已获得满意的就业录用（秋招Offer）而要求暂缓定校沟通，或实际申请季节与主合同登记的申请季不一致需办理更新。
    - [定校-边界-01] 本类 vs 『申请策略』：本类聚焦于定校阶段的“选什么学校与专业、修改选校确认单、因学制或课程重合无法申原专业、拒接保底档次、拿就业Offer暂缓定校”；若选校名单早已敲定，仅围绕投递阶段的先后批次节奏、留位费时间差或成绩单等级证明换算展开博弈 -> 归入『申请策略』。
    - [定校-边界-02] 本类 vs 『费用相关』：若核心矛盾在于选校方案调整、学制受限变更合同或单内换单外项目（仅附带提及优惠券如何抵扣） -> 归入『定校相关』；若核心矛盾完全在于解约退费或抗拒支付加申费/换专业费 -> 归入『费用相关』。
    - [定校-边界-03] 【豁免条款】：因院校官方项目停招、专业取消等客观外部原因，服务团队仅作常规信息同步并沟通调整备选，在客户未就选校档次产生明确抗拒或服务投诉前，不判定为本类风险。
    - [定校-边界-04] 本类 vs 『难度客户』：若客户核心矛盾在于以个人隐私为由拒绝同步完整邮件/材料、严重阻碍核实配合，归入『难度客户』。
    - [定校-预兆-01] 客户对选校方案中的保底档次强烈不满，明确表态拒绝特定排名以外的院校，拖延签署选校确认单（典型措辞如：“虽然目前均分不算高，但排名靠后的保底学校我们绝对不接受！这个学校的认可名单到底是怎么规定的？”）。
    - [定校-预兆-02] 核查官网要求时发现学制年限、本科课程重合度或推荐人条件不满足原定专业要求，不得不重构选校方案（典型措辞如：“核实下来有好几个目标项目不接受三年制本科（或与我本科课程重合度太高无法申请），我们需要调整选校方案或变更合同类型。”）。
    - [定校-预兆-03] 学生提及已拿到工作Offer希望推迟定校，或家长要求将已签确认单的专业更换为单外专业（典型措辞如：“我们想把选校确认单里的原定专业换成另一个方向的项目，之前用的优惠券怎么抵扣？”、“我目前已经拿到比较满意的工作Offer了，想等秋招全部结束再商量定校的事。”）。
    - [定校-预兆-04] 在选校方案敲定或核验阶段，学生或顾问主动发起对特定学制门槛（如三年制本科受限）、认可名单匹配度的紧急复核与邮件查证，存在原定项目无法投递、方案亟待调整的隐性风险。

- type: "难度客户"
  details: |
    - [难度-描述-01] 自身拖延/晚交素材或刚签约却强逼极限加急赶DDL、质疑常规文书周期：客户系临近截止刚签约，或因自身备考/拖延直至院校首轮截止前夕才交出零星文书素材（甚至拒交素材），却不接受合同约定的常规文书制作/翻译周期（如嫌PS初稿需2~4周、中翻英需1周、高峰期排期慢），质疑排期推迟、强逼服务方在短时间内赶出全套文书并完成投递，或要求出具事项进程表、发送长篇分条列点的最后通牒限令当天给出书面倒排时间表。
    - [难度-描述-02] 家长强势包办与依据AI/外部意见无休止变卦：学生本人隐身，家长全程强势主导，频繁借助AI工具或听信亲友意见审视文书，在多轮确认定稿后仍反复推翻重改、不断更新数据，对沟通过的结论记不住而反复追问，或对常规表述过度敏感。
    - [难度-描述-03] 正常时效内高频电话轰炸与无理投诉：顾问在正常工作时间与规定响应时效内正常回复，客户仍因自身焦虑指责回复太慢，频繁跨级向销售打电话投诉、非工作时间密集连环催促，或凡事自行决定仅单方面命令机构执行。
    - [难度-描述-04] 拒绝透明配合与强防御性挑刺：客户以个人隐私为由拒绝提供与院校往来的完整邮件而仅靠口头转述；或因前期其他项目未录、过往申请受挫导致信任度极低，进群即严苛盘问老师工作年限与专业背景、在群内频繁质疑老师专业建议（如经历取舍建议）与文书进度、对已提交材料进行全方位吹毛求疵。
    - [难度-边界-01] 本类 vs 『申请策略』：若客户因自身刚签约、刚出语言或晚交提纲，导致客观剩余时间远不足以走完常规文书周期，却强逼几天内出稿赶首轮DDL、发长文最后通牒或倒打一耙指责机构拖延 -> 优先归入『难度客户』；若客户前期按时配合，矛盾围绕既定分批投递计划的先后顺序、因等待客观证件顺延或留位费时间差展开 -> 归入『申请策略』。
    - [难度-边界-02] 本类 vs 『文书问题』：凡文书尚未逾期，服务方告知的是正常文书制作/翻译排期（如PS初稿需2~4周、中翻英需1周），而客户因自身焦虑赶DDL拒不接受正常制作周期、质疑排期推迟、要求提供事项进程表或书面倒排时间表，或凭AI/朋友意见在定稿后反复变卦改稿4轮以上、盘问老师年限与专业出身、在规定时效内高频投诉回复慢 -> 一律优先归入『难度客户』；仅当围绕已交付文书本身的事实错误、AI率指标或实质性返稿超期提出诉求 -> 归入『文书问题』。
    - [难度-边界-03] 本类 vs 『拖延失联』：客户因自身备考或撰写论文推迟交稿，学生隐身由家长出面交涉，虽素材严重逾期但仍有间歇互动或对服务细节有强控制诉求，后续伴随极限加急风险的 -> 优先归入『难度客户』；仅当客户全渠道彻底失联断联、既不回应也不提任何诉求导致流程纯粹停摆 -> 归入『拖延失联』。
    - [难度-预兆-01] 客户前脚刚考出语言或刚提交素材提纲，后脚即强硬要求几天内必须完成全部文书赶首轮截止，完全不接受常规排期解释（典型措辞如：“我虽然刚出语言成绩/刚交提纲，但这所学校第一轮马上截止了，不管你们常规周期要几周，这周必须把文书赶出来！今天下班前必须给我书面倒排时间表！”）。
    - [难度-预兆-02] 客户在群内发送带编号的正式质问长文，限令当天指定时间前给出书面交付时间表。
    - [难度-预兆-03] 家长全程包办并频繁拿AI或外部人员意见推翻已确认的文书，或在正常回复间隔内连环致电销售投诉回复不及时（典型措辞如：“为什么发消息不秒回？虽然在你们规定时效内，但我们现在非常焦虑，我已经给咨询老师打了好几个电话投诉了！”、“我朋友和AI看了这版简历觉得还是不行，虽然前几次确认过了，但今天我又调整了经历数据，必须重新按我说的改！另外文书老师工作几年了？是不是我们这个专业出身？”）。
    - [难度-预兆-04] 家长深度介入且高敏防备，抓住顾问与规划师沟通中的细节误差质疑规划前后不一致并强令多方重新开会梳理，或对推荐信格式、网推授权等常规流程反复产生疑虑，致使多位导师或主管需轮番入群介入解释澄清，或以个人隐私为由拒发原件（典型措辞如：“我和学校往来的邮件涉及个人隐私不能发群里，我口头转述给你们听就行。”）。
